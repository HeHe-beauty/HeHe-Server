name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # HeheApplicationTests는 실제 MySQL/Redis 연결이 필요한 전체 컨텍스트 로드 테스트라 CI 러너에서 제외
      # (로컬에서도 사전 인프라 없이는 실패하는 기존 이슈, service/controller 단위 테스트만으로 검증)
      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --tests "org.dev.hehe.service.*" --tests "org.dev.hehe.controller.*"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: taehwannoh/hehe-server:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull taehwannoh/hehe-server:latest
            docker stop hehe-server || true
            docker rm hehe-server || true
            docker run -d \
              --name hehe-server \
              --network=host \
              -e JAVA_OPTS="-Xmx256m" \
              -e JWT_SECRET="JfV/ZoMm8s33sznFmOfhPk4IVZCm6U74iHRIgo/q0kc=" \
              -e SPRING_CONFIG_ADDITIONAL_LOCATION="file:/app/application-prod.yml" \
              -e FIREBASE_CREDENTIALS_PATH="/etc/hehe/firebase-service-account.json" \
              -v ~/app/application-prod.yml:/app/application-prod.yml \
              -v /etc/hehe/firebase-service-account.json:/etc/hehe/firebase-service-account.json \
              -v ~/app/logs:/app/logs \
              taehwannoh/hehe-server:latest
